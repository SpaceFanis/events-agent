name: Scout
on:
  schedule:
    # 05:17 UTC (07:17 Athens in winter) plus a backup at 15:47 UTC: GitHub may delay or drop
    # scheduled runs (none fired on 2026-11-24). A second run is safe: alerts, reminders and
    # notices are claimed once, extractions are cached, and it only pays for events new since
    # the morning. Off the hour, because top-of-hour cron jobs queue longest.
    - cron: "17 5 * * *"
    - cron: "47 15 * * *"
  workflow_dispatch:
permissions:
  contents: read
# One run at a time: overlapping runs could pay twice for the same page (SPEC M2 known gap).
concurrency:
  group: scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # criteria.yaml is git-ignored (it holds the personal profile); it lives in a secret.
      - name: Write criteria.yaml
        env:
          CRITERIA_YAML: ${{ secrets.CRITERIA_YAML }}
        run: |
          if [ -z "$CRITERIA_YAML" ]; then
            echo "::error::repository secret CRITERIA_YAML is not set"
            exit 1
          fi
          printf '%s\n' "$CRITERIA_YAML" > criteria.yaml
      - name: Scout
        run: npm run scout -- --criteria criteria.yaml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
