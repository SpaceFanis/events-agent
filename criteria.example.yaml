# Copy to criteria.yaml (git-ignored) and edit.
profile: >
  Student interested in AI and robotics. Prefer hands-on hackathons and
  competitions with prizes or travel support over passive talks.
interests: [artificial intelligence, machine learning, robotics]
keywords:
  include: [AI, ML, robotics, hackathon]
  exclude: [crypto, NFT, web3]
eventTypes: [hackathon, conference, competition, fellowship, summer_school]
home:
  city: Athens
  country: Greece
  timezone: Europe/Athens
# Minimum worth score (0-10) per location tier.
minScore: { local: 5, country: 7, abroad: 9, online: 6 }
dateWindowDays: 180
eligibility:
  student: true
  age: 20
  nationality: Greek
limits:
  maxLlmCallsPerRun: 60
  monthlyBudgetUsd: 1
  maxAlertsPerRun: 20
sources:
  - kind: devpost
  - kind: mlh
  # Feeds need a `name` (shown in errors and "source broken" notices instead of the URL, which may
  # hold a secret token) and take an optional `type` (used when an item's title names no event
  # type; defaults: luma → meetup, rss/ics → other).
  # A Luma calendar or city: its ICS URL from the page's "Add to calendar" / RSS menu.
  # - kind: luma
  #   url: https://api.lu.ma/ics/get?entity=calendar&id=cal-XXXXXXXX
  #   name: AI Athens
  # - kind: rss
  #   url: https://opportunitydesk.org/feed/
  #   name: Opportunity Desk
  #   type: fellowship
  # - kind: ics
  #   url: https://example.org/events.ics
  #   name: Uni robotics lab
calendar:
  tentativeHoldOnApply: false
  # Google calendar ids checked for conflicts ("primary" is your main calendar).
  check: [primary]
